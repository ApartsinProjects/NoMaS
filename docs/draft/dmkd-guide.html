async function dec(pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);

 const dl=document.getElementById("dl");dl.href=url;dl.download=NAME;
 if(MIME==="application/pdf"){document.getElementById("frame").src=url;}else{document.getElementById("frame").remove();dl.click();}}
